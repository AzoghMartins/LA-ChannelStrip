name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to create and publish from this commit, e.g. v0.2 (leave empty for a plain build)"
        required: false
        default: ""

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cd build/LAChannelStrip_artefacts/Release
          tar czf ../../../LA-ChannelStrip-linux-x86_64.tar.gz VST3/LA-ChannelStrip.vst3 LV2/LA-ChannelStrip.lv2 Standalone/LA-ChannelStrip

      - uses: actions/upload-artifact@v4
        with:
          name: LA-ChannelStrip-linux-x86_64
          path: LA-ChannelStrip-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/LAChannelStrip_artefacts/Release/VST3/LA-ChannelStrip.vst3 -DestinationPath LA-ChannelStrip-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LA-ChannelStrip-windows-x64
          path: LA-ChannelStrip-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Sign (ad hoc)
        run: |
          cd build/LAChannelStrip_artefacts/Release
          codesign --force --deep --sign - VST3/LA-ChannelStrip.vst3 AU/LA-ChannelStrip.component

      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/LAChannelStrip_artefacts/Release/AU/LA-ChannelStrip.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx LaCs LaAu

      - name: Package
        run: |
          cd build/LAChannelStrip_artefacts/Release
          zip -r -y ../../../LA-ChannelStrip-macos-universal.zip VST3/LA-ChannelStrip.vst3 AU/LA-ChannelStrip.component

      - uses: actions/upload-artifact@v4
        with:
          name: LA-ChannelStrip-macos-universal
          path: LA-ChannelStrip-macos-universal.zip

  # Runs for a pushed v* tag, or for a manual run with a release tag (which creates the tag on this commit)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LA-ChannelStrip ${{ inputs.release || github.ref_name }}
          files: |
            LA-ChannelStrip-linux-x86_64.tar.gz
            LA-ChannelStrip-windows-x64.zip
            LA-ChannelStrip-macos-universal.zip
          generate_release_notes: true
